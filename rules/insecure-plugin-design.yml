# LLM07 — Insecure Plugin / Tool Design
#
# When you expose a tool to an LLM, it's effectively a user-controlled API
# endpoint with no authn. These rules flag tool implementations that are
# unsafe by themselves *regardless* of what the LLM does.

rules:
  # GENERALISED DECORATOR + SINK MATCHING.
  #
  # The original version enumerated exactly `@tool` / `@tool(...)` with
  # `subprocess.run(..., shell=True)` or `os.system`. Mutation testing across
  # seven realistic spellings found four false negatives: `subprocess.call`,
  # `subprocess.Popen`, `subprocess.check_output`, and the OpenAI Agents SDK's
  # `@function_tool`. The decorator is now matched by name shape and the sink
  # by the family of shell-exec primitives.
  - id: ai.insecure-plugin.tool-runs-shell-py
    message: >-
      LLM tool implementation runs a shell command via `subprocess(..., shell=True)`
      or `os.system`. The tool argument is, by construction, attacker-controlled
      (any prompt injection can call this tool with any string). Refuse the tool
      entirely, switch to an allowlisted operation, or use argv form with a
      strict argument schema.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "LLM07:2026 Insecure Plugin Design"
      impact: HIGH
    patterns:
      - pattern-either:
          - pattern: |
              @$DEC
              def $NAME(...):
                  ...
                  $SHELL
                  ...
          - pattern: |
              @$DEC(...)
              def $NAME(...):
                  ...
                  $SHELL
                  ...
          - pattern: |
              @$DEC
              async def $NAME(...):
                  ...
                  $SHELL
                  ...
          - pattern: |
              @$DEC(...)
              async def $NAME(...):
                  ...
                  $SHELL
                  ...
      - metavariable-regex:
          metavariable: $DEC
          regex: "^([A-Za-z_][A-Za-z_0-9]*\\.)*(tool|function_tool|ai_function|agent_tool)$"
      - metavariable-pattern:
          metavariable: $SHELL
          patterns:
            - pattern-either:
                - pattern: subprocess.run($CMD, ..., shell=True, ...)
                - pattern: subprocess.call($CMD, ..., shell=True, ...)
                - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
                - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
                - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
                - pattern: os.system($CMD)
                - pattern: os.popen($CMD)
            # An argv ARRAY never involves a shell, so it is the recommended
            # fix and must stay quiet.
            - pattern-not: subprocess.$M([...], ...)

  # URL ARGUMENT SHAPE, NOT ONE CLIENT LIBRARY.
  #
  # The original version required the first tool parameter to be passed
  # *directly* to `requests.get` / `httpx.$M` / `urllib.request.urlopen`.
  # Mutation testing found three false negatives: the URL copied into a local
  # first, `requests.post(url, json=...)`, and `requests.request("GET", url)`.
  #
  # The rule now flags any HTTP client call inside a tool whose URL argument is
  # a bare identifier — i.e. a value flowing from the tool's own arguments.
  # A string literal or an allowlist lookup (`ALLOWED[name]`) is not a bare
  # identifier, which is what keeps the safe forms quiet.
  - id: ai.insecure-plugin.tool-fetches-arbitrary-url-py
    message: >-
      LLM tool implementation performs a network request to a URL derived
      from its arguments without any allowlist check. This is SSRF — an
      attacker can pivot from prompt injection to internal-network access
      (cloud metadata endpoints, internal admin APIs, etc.). Enforce an
      allowlist of host patterns before the request leaves the function.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "LLM07:2026 Insecure Plugin Design"
      impact: HIGH
    patterns:
      - pattern-either:
          - pattern: |
              @$DEC
              def $NAME(...):
                  ...
                  $FETCH
                  ...
          - pattern: |
              @$DEC(...)
              def $NAME(...):
                  ...
                  $FETCH
                  ...
          - pattern: |
              @$DEC
              async def $NAME(...):
                  ...
                  $FETCH
                  ...
          - pattern: |
              @$DEC(...)
              async def $NAME(...):
                  ...
                  $FETCH
                  ...
      - metavariable-regex:
          metavariable: $DEC
          regex: "^([A-Za-z_][A-Za-z_0-9]*\\.)*(tool|function_tool|ai_function|agent_tool)$"
      - metavariable-pattern:
          metavariable: $FETCH
          patterns:
            - pattern-either:
                # URL is the first positional argument.
                - patterns:
                    - pattern-either:
                        - pattern: requests.$M($URL, ...)
                        - pattern: httpx.$M($URL, ...)
                        - pattern: aiohttp.$M($URL, ...)
                        - pattern: $SESSION.get($URL, ...)
                        - pattern: $SESSION.post($URL, ...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: "^(get|post|put|patch|delete|head|options|request|stream)$"
                # urllib has no method metavariable to constrain.
                - pattern: urllib.request.urlopen($URL, ...)
                - pattern: urlopen($URL, ...)
                # `requests.request("GET", url)` — verb first, URL second.
                - patterns:
                    - pattern-either:
                        - pattern: requests.request($VERB, $URL, ...)
                        - pattern: httpx.request($VERB, $URL, ...)
                        - pattern: $SESSION.request($VERB, $URL, ...)
            # Only a bare identifier counts: a literal URL is the developer's
            # own endpoint and `ALLOWED[name]` is the allowlist this rule asks
            # for. Neither is attacker-controlled.
            - metavariable-regex:
                metavariable: $URL
                regex: "^[A-Za-z_][A-Za-z_0-9]*$"
