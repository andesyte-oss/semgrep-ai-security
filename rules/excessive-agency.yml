# LLM08 — Excessive Agency
#
# Agentic systems get into trouble when the LLM has direct access to
# irreversible side effects (sending emails, writing to prod DBs,
# transferring funds) without a confirm-step. These rules flag the most
# common patterns.

rules:
  # GENERALISED DECORATOR + OPERATION MATCHING.
  #
  # The original version hardcoded `@tool` (bare) and three destructive call
  # shapes. Mutation testing across seven realistic spellings found four
  # false negatives: `@tool("name", return_direct=True)`, the OpenAI Agents
  # SDK's `@function_tool`, `conn.execute("DELETE FROM ...")` (the string
  # ellipsis never matched a partial literal), and `os.remove(...)`.
  #
  # The decorator is now matched by name shape (bare, called, or
  # module-qualified) and the destructive operation by a verb allowlist, so
  # the rule follows the *category* of call rather than one spelling.
  - id: ai.excessive-agency.tool-deletes-without-confirmation-py
    message: >-
      LLM-callable tool performs a delete / destroy operation with no
      explicit `confirm` argument the model must surface to the user.
      Prompt-injection turns this into a one-click data-loss vector.
      Require an explicit confirmation token, or route through a
      human-in-the-loop approval step before executing the destructive
      call.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-863: Incorrect Authorization"
      owasp: "LLM08:2026 Excessive Agency"
      impact: HIGH
    patterns:
      - pattern-either:
          # Destructive method / function call by verb.
          - patterns:
              - pattern-either:
                  - pattern: |
                      @$DEC
                      def $NAME(...):
                          ...
                          $X.$M(...)
                          ...
                  - pattern: |
                      @$DEC(...)
                      def $NAME(...):
                          ...
                          $X.$M(...)
                          ...
                  - pattern: |
                      @$DEC
                      async def $NAME(...):
                          ...
                          $X.$M(...)
                          ...
                  - pattern: |
                      @$DEC(...)
                      async def $NAME(...):
                          ...
                          $X.$M(...)
                          ...
              - metavariable-regex:
                  metavariable: $M
                  regex: "^(delete|delete_one|delete_many|delete_object|delete_objects|destroy|drop|drop_table|drop_collection|remove|unlink|rmtree|purge|truncate|wipe)$"
          # Destructive SQL executed through a generic cursor API.
          - patterns:
              - pattern-either:
                  - pattern: |
                      @$DEC
                      def $NAME(...):
                          ...
                          $X.$M($Q, ...)
                          ...
                  - pattern: |
                      @$DEC(...)
                      def $NAME(...):
                          ...
                          $X.$M($Q, ...)
                          ...
                  - pattern: |
                      @$DEC
                      async def $NAME(...):
                          ...
                          $X.$M($Q, ...)
                          ...
                  - pattern: |
                      @$DEC(...)
                      async def $NAME(...):
                          ...
                          $X.$M($Q, ...)
                          ...
              - metavariable-regex:
                  metavariable: $M
                  regex: "^(execute|executemany|execute_query|exec_driver_sql|run)$"
              - metavariable-regex:
                  metavariable: $Q
                  regex: '(?is)^[frbu]*[''"].*\b(delete\s+from|drop\s+table|truncate\s+table)\b.*$'
      - metavariable-regex:
          metavariable: $DEC
          regex: "^([A-Za-z_][A-Za-z_0-9]*\\.)*(tool|function_tool|ai_function|agent_tool)$"
      - metavariable-regex:
          metavariable: $NAME
          regex: "^(delete|destroy|drop|wipe|purge|remove|truncate)_.*"
      # A confirmation parameter the model must set is exactly the mitigation
      # this rule asks for. Flagging a correctly-guarded tool teaches users
      # that doing the right thing still trips the scanner.
      - pattern-not: |
          @$DEC
          def $NAME(..., $CONFIRM, ...):
              ...
              if ...:
                  raise ...
              ...
      - pattern-not: |
          @$DEC(...)
          def $NAME(..., $CONFIRM, ...):
              ...
              if ...:
                  raise ...
              ...
      - pattern-not: |
          @$DEC
          async def $NAME(..., $CONFIRM, ...):
              ...
              if ...:
                  raise ...
              ...

  - id: ai.excessive-agency.tool-broad-shell-py
    message: >-
      An LLM tool named like a generic shell ("execute_command",
      "run_shell", "bash", "sh") is exposed without an allowlist. This
      gives the model arbitrary shell access. Replace with narrow,
      verb-specific tools (e.g. `list_files`, `read_file`) and refuse
      wildcard shell access entirely.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-77: Improper Neutralization of Special Elements used in a Command"
      owasp: "LLM08:2026 Excessive Agency"
      impact: HIGH
    patterns:
      - pattern-either:
          - pattern: |
              @$DEC
              def $NAME(...):
                  ...
          - pattern: |
              @$DEC(...)
              def $NAME(...):
                  ...
          - pattern: |
              @$DEC
              async def $NAME(...):
                  ...
          - pattern: |
              @$DEC(...)
              async def $NAME(...):
                  ...
      - metavariable-regex:
          metavariable: $DEC
          regex: "^([A-Za-z_][A-Za-z_0-9]*\\.)*(tool|function_tool|ai_function|agent_tool)$"
      - metavariable-regex:
          metavariable: $NAME
          regex: "^(execute_command|run_shell|run_bash|run_command|shell|bash|sh|run|exec|execute)$"
